# nginx do site dmobservait.com (container dm-observait-site). Vai para /etc/nginx/conf.d/default.conf; os .inc ficam
# em /etc/nginx/dm/nginx/ (volume "servidor", preenchido pelo site-download a partir de dist/_servidor/).
server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml text/plain;
  absolute_redirect off;
  # DNS do Docker na hora do pedido: o nginx sobe mesmo se o serviço da loja ainda não estiver de pé
  resolver 127.0.0.11 valid=30s ipv6=off;
  error_page 404 /404.html;
  location = /404.html { internal; include /etc/nginx/dm/nginx/dm-headers.inc; }

  # painel: sessão (login por código) em tudo, menos a tela de login e a API do login; "^~" evita que .css/.js escapem
  # pela regra de estáticos. Se o serviço de login cair, só o /admin fecha: o site e a loja não dependem dele.
  location = /admin { return 301 /admin/; }
  # verificação de sessão (auth_request): erro do serviço de login vira 401, nunca 500
  location = /_dm_auth {
    internal;
    set $login http://dm-observait-login:8081;
    proxy_pass $login/verificar;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @dm_auth_negado;
  }
  location @dm_auth_negado { return 401; }
  location @dm_login {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
    if ($http_accept ~* "text/html") { return 302 /admin/login; }
    return 401;
  }
  # tela de login e API do login: públicas (nada aqui entrega dado do painel)
  location = /admin/login {
    try_files /admin/login/index.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
  location ^~ /admin/login/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
  location ^~ /admin/auth/ {
    client_max_body_size 8k;
    set $login http://dm-observait-login:8081;
    rewrite ^/admin(/auth/.*)$ $1 break;
    proxy_pass $login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
    add_header Cache-Control "no-store" always;
  }
  # entrada de emergência pela senha antiga (só enquanto o dm-admin-senha.inc tiver conteúdo): pede a senha e segue para /admin/
  location = /admin/emergencia {
    alias /usr/share/nginx/html/admin/login/emergencia.html;
    include /etc/nginx/dm/nginx/dm-admin-senha.inc;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
  # dados do painel: decifrados pelo site-download no volume do servidor (não servido); vêm de _servidor/admin/dados.enc
  location = /admin/dados.json {
    alias /etc/nginx/dm/admin/dados.json;
    default_type application/json;
    include /etc/nginx/dm/nginx/dm-admin.inc;
  }
  # API da tela /admin/loja: só com sessão (ou senha de emergência); o serviço fica numa rede interna, sem porta pública
  location ^~ /admin/api/ {
    include /etc/nginx/dm/nginx/dm-admin.inc;
    client_max_body_size 4m;
    set $loja http://dm-observait-loja:8080;
    proxy_pass $loja;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
  location ^~ /admin/ {
    try_files $uri $uri/ =404;
    include /etc/nginx/dm/nginx/dm-admin.inc;
  }

  # dados públicos da loja, gravados pelo serviço: lista sempre atual e capas com nome único
  location ^~ /loja/dados/capas/ {
    alias /usr/share/nginx/loja-dados/publico/capas/;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
  location ^~ /loja/dados/ {
    alias /usr/share/nginx/loja-dados/publico/;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }

  location = /.versao { add_header Cache-Control "no-cache" always; default_type text/plain; include /etc/nginx/dm/nginx/dm-headers.inc; }

  # endereços sem ".html": a home é /home (dmobservait.com vai para lá), /solucoes serve solucoes.html; os antigos com
  # .html redirecionam
  location = / { return 301 /home$is_args$args; }
  location = /home {
    try_files /index.html =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
  location = /index.html { return 301 /home$is_args$args; }
  location ~ ^/(?<pagina>[a-z0-9-]+)\.html$ { return 301 /$pagina$is_args$args; }
  # outros idiomas (i18n.mjs): /en/home, /es/solucoes, /pt-pt/contato...; /en e /en/ vão para /en/home
  location ~ ^/(?<idioma>en|es|pt-pt)/?$ { return 301 /$idioma/home$is_args$args; }
  location ~ ^/(?<idioma>en|es|pt-pt)/home$ {
    try_files /$idioma/index.html =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
  location ~ ^/(?<idioma>en|es|pt-pt)/(?<pagina>[a-z0-9-]+)\.html$ { return 301 /$idioma/$pagina$is_args$args; }
  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
  location ~* \.(css|js|svg|png|webp|jpg)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
}
