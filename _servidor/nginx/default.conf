# nginx do site dmobservait.com (container dm-observait-site). Vai para /etc/nginx/conf.d/default.conf; os .inc ficam
# em /etc/nginx/dm/nginx/ (volume "servidor", preenchido pelo site-download a partir de dist/_servidor/).
server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/xml text/plain;
  absolute_redirect off;
  # DNS do Docker na hora do pedido: o nginx sobe mesmo se o serviço da loja ainda não estiver de pé
  resolver 127.0.0.11 valid=30s ipv6=off;
  error_page 404 /404.html;
  location = /404.html { internal; include /etc/nginx/dm/nginx/dm-headers.inc; }

  # painel: sessão (login por código) em tudo, menos a tela de login e a API do login; "^~" evita que .css/.js escapem
  # pela regra de estáticos. Se o serviço de login cair, só o /admin fecha: o site e a loja não dependem dele.
  location = /admin { return 301 /admin/; }
  # verificação de sessão e de permissão (auth_request): o serviço de login devolve 204 (liberado), 401 (sem sessão) ou 403
  # (sem a seção, ou "somente leitura" tentando agir). Uma localização interna por seção, porque cada uma fixa a seção
  # na própria chamada; erro do serviço de login vira 401, nunca 500. Seções: visao, loja, infra, servidores, dyno, conta;
  # "dono" (gerir acessos e segurança) e "qualquer" (qualquer sessão válida: arquivos estáticos do painel).
  location = /_dm_auth_qualquer { internal; include /etc/nginx/dm/nginx/dm-auth.inc; proxy_pass $login/verificar?secao=qualquer; }
  location = /_dm_auth_visao { internal; include /etc/nginx/dm/nginx/dm-auth.inc; proxy_pass $login/verificar?secao=visao; }
  location = /_dm_auth_loja { internal; include /etc/nginx/dm/nginx/dm-auth.inc; proxy_pass $login/verificar?secao=loja; }
  location = /_dm_auth_infra { internal; include /etc/nginx/dm/nginx/dm-auth.inc; proxy_pass $login/verificar?secao=infra; }
  location = /_dm_auth_servidores { internal; include /etc/nginx/dm/nginx/dm-auth.inc; proxy_pass $login/verificar?secao=servidores; }
  location = /_dm_auth_dyno { internal; include /etc/nginx/dm/nginx/dm-auth.inc; proxy_pass $login/verificar?secao=dyno; }
  location = /_dm_auth_conta { internal; include /etc/nginx/dm/nginx/dm-auth.inc; proxy_pass $login/verificar?secao=conta; }
  location = /_dm_auth_dono { internal; include /etc/nginx/dm/nginx/dm-auth.inc; proxy_pass $login/verificar?secao=dono; }
  location @dm_auth_negado { return 401; }
  location @dm_login {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
    if ($http_accept ~* "text/html") { return 302 /admin/login; }
    return 401;
  }
  # logado, mas sem permissão para a seção: página → aviso em /admin/sem-acesso/; o resto → 403
  location @dm_negado {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
    if ($http_accept ~* "text/html") { return 302 /admin/sem-acesso/; }
    return 403;
  }
  # tela de login e API do login: públicas (nada aqui entrega dado do painel)
  location = /admin/login {
    try_files /admin/login/index.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
  location ^~ /admin/login/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
  location ^~ /admin/auth/ {
    client_max_body_size 16k;
    set $login http://dm-observait-login:8081;
    rewrite ^/admin(/auth/.*)$ $1 break;
    proxy_pass $login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-DM-Basic "";
    proxy_set_header X-DM-Metodo "";
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
    add_header Cache-Control "no-store" always;
  }
  # entrada de emergência pela senha antiga (só enquanto o dm-admin-senha.inc tiver conteúdo): pede a senha e o serviço de login
  # abre uma sessão do Dono ("senha de emergência"), que segue para /admin/. Sem auth_basic, o X-DM-Basic fica vazio e o serviço recusa.
  location = /admin/emergencia {
    include /etc/nginx/dm/nginx/dm-admin-senha.inc;
    set $login http://dm-observait-login:8081;
    proxy_pass $login/interno/emergencia;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-DM-Basic $remote_user;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_connect_timeout 3s;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
  # dados do painel: decifrados pelo site-download no volume do servidor (não servido; vêm de _servidor/admin/dados.enc) e
  # entregues pelo serviço de login, que tira o que a seção de cada pessoa não permite
  location = /admin/dados.json {
    auth_request /_dm_auth_qualquer;
    include /etc/nginx/dm/nginx/dm-admin.inc;
    set $login http://dm-observait-login:8081;
    proxy_pass $login/dados;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }
  # API da tela /admin/loja: só com sessão (ou senha de emergência); o serviço fica numa rede interna, sem porta pública
  location ^~ /admin/api/ {
    auth_request /_dm_auth_loja;
    include /etc/nginx/dm/nginx/dm-admin.inc;
    client_max_body_size 4m;
    set $loja http://dm-observait-loja:8080;
    proxy_pass $loja;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
  # API da seção Servidores: só com sessão (ou senha de emergência); o serviço fica numa rede interna, sem porta pública, e
  # fala com o agente de cada VPS por HTTPS assinado. Ações longas (Atualizar baixa imagens): até 6 min.
  location ^~ /admin/servidores-api/ {
    auth_request /_dm_auth_servidores;
    include /etc/nginx/dm/nginx/dm-admin.inc;
    client_max_body_size 16k;
    set $servidores http://dm-observait-servidores:8082;
    proxy_pass $servidores;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-DM-Usuario $remote_user;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 360s;
  }
  # páginas: cada uma exige a sua seção (o código das páginas é público; o que protege é o dados.json filtrado e as APIs)
  location = /admin/ { auth_request /_dm_auth_visao; include /etc/nginx/dm/nginx/dm-admin.inc; try_files /admin/index.html =404; }
  location = /admin/index.html { auth_request /_dm_auth_visao; include /etc/nginx/dm/nginx/dm-admin.inc; try_files $uri =404; }
  location ^~ /admin/loja/ { auth_request /_dm_auth_loja; include /etc/nginx/dm/nginx/dm-admin.inc; try_files $uri $uri/ =404; }
  location ^~ /admin/infra/ { auth_request /_dm_auth_infra; include /etc/nginx/dm/nginx/dm-admin.inc; try_files $uri $uri/ =404; }
  location ^~ /admin/dyno/ { auth_request /_dm_auth_dyno; include /etc/nginx/dm/nginx/dm-admin.inc; try_files $uri $uri/ =404; }
  location ^~ /admin/servidores/ { auth_request /_dm_auth_servidores; include /etc/nginx/dm/nginx/dm-admin.inc; try_files $uri $uri/ =404; }
  location ^~ /admin/conta/ { auth_request /_dm_auth_conta; include /etc/nginx/dm/nginx/dm-admin.inc; try_files $uri $uri/ =404; }
  location ^~ /admin/conta/acessos/ { auth_request /_dm_auth_dono; include /etc/nginx/dm/nginx/dm-admin.inc; try_files $uri $uri/ =404; }
  location ^~ /admin/conta/integracoes/ { auth_request /_dm_auth_dono; include /etc/nginx/dm/nginx/dm-admin.inc; try_files $uri $uri/ =404; }
  location ^~ /admin/conta/seguranca/ { auth_request /_dm_auth_dono; include /etc/nginx/dm/nginx/dm-admin.inc; try_files $uri $uri/ =404; }
  # o resto (js, css, aviso "sem acesso"): qualquer sessão válida
  location ^~ /admin/ {
    auth_request /_dm_auth_qualquer;
    include /etc/nginx/dm/nginx/dm-admin.inc;
    try_files $uri $uri/ =404;
  }

  # dados públicos da loja, gravados pelo serviço: lista sempre atual e capas com nome único
  location ^~ /loja/dados/capas/ {
    alias /usr/share/nginx/loja-dados/publico/capas/;
    add_header Cache-Control "public, max-age=604800, immutable" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
  location ^~ /loja/dados/ {
    alias /usr/share/nginx/loja-dados/publico/;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }

  location = /.versao { add_header Cache-Control "no-cache" always; default_type text/plain; include /etc/nginx/dm/nginx/dm-headers.inc; }

  # endereços sem ".html": a home é /home (dmobservait.com vai para lá), /solucoes serve solucoes.html; os antigos com
  # .html redirecionam
  location = / { return 301 /home$is_args$args; }
  location = /home {
    try_files /index.html =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
  location = /index.html { return 301 /home$is_args$args; }
  location ~ ^/(?<pagina>[a-z0-9-]+)\.html$ { return 301 /$pagina$is_args$args; }
  # outros idiomas (i18n.mjs): /en/home, /es/solucoes, /pt-pt/contato...; /en e /en/ vão para /en/home
  location ~ ^/(?<idioma>en|es|pt-pt)/?$ { return 301 /$idioma/home$is_args$args; }
  location ~ ^/(?<idioma>en|es|pt-pt)/home$ {
    try_files /$idioma/index.html =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
  location ~ ^/(?<idioma>en|es|pt-pt)/(?<pagina>[a-z0-9-]+)\.html$ { return 301 /$idioma/$pagina$is_args$args; }
  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
  location ~* \.(css|js|svg|png|webp|jpg)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
}
