# WorkAI (workai.dmobservait.com). Este arquivo NÃO entra sozinho no nginx.
# O site-download deixa ele em /etc/nginx/dm/nginx/workai.conf. Para valer, o Daniel
# copia para o conf.d (ou inclui no http{}). Passo a passo: workai/PUBLICAR.md.
# Enquanto isso, o server do site público devolve 404 em /workai/ (default.conf).
#
# TLS termina no proxy da frente, como no dmobservait.com. Aqui só HTTP.
# O cookie de sessão continua __Host-dm_admin, sem Domain: o navegador guarda um
# cookie deste host, emitido pelo mesmo serviço de login. Não há CORS: a tela de
# login, /admin/auth/ e o escritório são a mesma origem.

server {
  listen 80;
  server_name workai.dmobservait.com;
  server_tokens off;
  root /usr/share/nginx/html;
  charset utf-8;
  absolute_redirect off;
  resolver 127.0.0.11 valid=30s ipv6=off;

  location = /_dm_auth_workai {
    internal;
    include /etc/nginx/dm/nginx/dm-auth.inc;
    proxy_pass $login/verificar?secao=qualquer;
  }
  location @dm_auth_negado { return 401; }
  location @dm_login {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
    return 302 /admin/login;
  }
  location @dm_negado {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
    return 403;
  }

  # a mesma tela de /admin/login (HTML, CSS e JS). Nada de credencial nova.
  location = /admin/login {
    try_files /admin/login/index.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
  location ^~ /admin/login/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/dm/nginx/dm-headers.inc;
  }
  location ^~ /admin/auth/ {
    client_max_body_size 16k;
    set $login http://dm-observait-login:8081;
    rewrite ^/admin(/auth/.*)$ $1 break;
    proxy_pass $login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-DM-Basic "";
    proxy_set_header X-DM-Metodo "";
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
    add_header Cache-Control "no-store" always;
  }

  location = /favicon.svg { try_files /favicon.svg =404; include /etc/nginx/dm/nginx/dm-headers.inc; }
  location = /styles.css { try_files /styles.css =404; include /etc/nginx/dm/nginx/dm-headers.inc; }
  location = /home { return 302 https://dmobservait.com/home; }

  location = / {
    auth_request /_dm_auth_workai;
    error_page 401 = @dm_login;
    include /etc/nginx/dm/nginx/dm-admin.inc;
    try_files /workai/index.html =404;
  }
  location = /workai/index.html {
    auth_request /_dm_auth_workai;
    error_page 401 = @dm_login;
    include /etc/nginx/dm/nginx/dm-admin.inc;
    try_files $uri =404;
  }
  location = /workai/workai.js {
    auth_request /_dm_auth_workai;
    error_page 401 = @dm_login;
    include /etc/nginx/dm/nginx/dm-admin.inc;
    try_files $uri =404;
  }
  location = /workai/workai.css {
    auth_request /_dm_auth_workai;
    error_page 401 = @dm_login;
    include /etc/nginx/dm/nginx/dm-admin.inc;
    try_files $uri =404;
  }
  location ^~ /workai/assets/avatares/ {
    auth_request /_dm_auth_workai;
    error_page 401 = @dm_login;
    include /etc/nginx/dm/nginx/dm-admin.inc;
    try_files $uri =404;
  }
  location ^~ /workai/ { return 404; }
  location / { return 404; }
}
